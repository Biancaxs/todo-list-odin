<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo-list Odin</title>
</head>
<body>
    
    <aside>

        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>view-list</title><path d="M9,5V9H21V5M9,19H21V15H9M9,14H21V10H9M4,9H8V5H4M4,19H8V15H4M4,14H8V10H4V14Z" /></svg>
            <h2>todo-list odin</h2>
        </div>
        <div class="projects-aside">
            <ul id="projects"></ul>
            <button id="openProjectDialog">New project</button>
            <dialog id="projectDialog">
                <form method="dialog">
                    <h2>New Project</h2>
                    
                    <input type="text" id="projectName" name="projectName" placeholder="Project name *">

                    <div>
                        <button type="button" formmethod="dialog" id="cancelProjectBtn">Cancel</button>
                        <button id="createProjectBtn" value="create">Create</button>
                    </div>
                </form>
            </dialog>
        </div>

    </aside>

    <main>

        <div class="all-tasks">
            <h2>All Tasks</h2>
            <button id="openTaskDialog">Add task</button>
        </div>
        
        <ul id="todo"></ul>

        <dialog id="taskDialog">
            <form method="dialog">
                <h2>New Task</h2>
                
                <input type="text" id="taskTitle" name="taskTitle" placeholder="Task title *" required>

                <input type="text" id="taskDescription" name="taskDescription" placeholder="Description (optional)">

                <label for="taskDueDate">Due date</label>
                <input type="date" id="taskDueDate" name="taskDueDate" required>
                
                <label for="taskPriority">Priority</label>
                <select name="taskPriority" id="taskPriority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="high">Urgent</option>
                </select>

                <label for="taskProject">Project</label>
                <select name="taskProject" id="taskProject">
                    <option value="Standard">Standard</option>
                </select>

                <input type="text" id="taskNotes" name="taskNotes" placeholder="Notes (optional)">


                <div>
                    <button type="button" formmethod="dialog" id="cancelTaskBtn">Cancel</button>
                    <button id="createTaskBtn" value="create">Create task</button>
                </div>
            </form>
        </dialog>


        <dialog id="taskDetailsDialog">
            <div class="modal-content">
                <h2 id="modalTaskTitle">Task Title</h2>
                <p><strong>Description:</strong> <span id="modalTaskDesc"></span></p>
                <p><strong>Due Date:</strong> <span id="modalTaskDate"></span></p>
                <p><strong>Priority:</strong> <span id="modalTaskPriority"></span></p>
                <p><strong>Notes:</strong> <span id="modalTaskNotes"></span></p>
                
                <div class="modal-actions">
                    <button id="modalEditBtn">Edit</button>
                    <button id="modalDeleteBtn">Delete</button>
                    <button id="modalCloseBtn">Close</button>
                </div>
            </div>
        </dialog>

    </main>

</body>
</html>
