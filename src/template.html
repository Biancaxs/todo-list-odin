<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo-list Odin</title>
</head>
<body>
    
    <aside>

        <ul id="projects"></ul>
        <button id="openProjectDialog">New project</button>
        <dialog id="projectDialog">
            <form method="dialog">
                <h2>New Project</h2>
                
                <input type="text" id="projectName" name="projectName" placeholder="Project name *" required>

                <div>
                    <button value="cancel">Cancel</button>
                    <button id="createProjectBtn" value="create">Create</button>
                </div>
            </form>
        </dialog>

    </aside>

    <main>

        <h2></h2>
        <ul id="todo"></ul>

        <button id="openTaskDialog">Add task</button>
        <dialog id="taskDialog">
            <form method="dialog">
                <h2>New Task</h2>
                
                <input type="text" id="taskTitle" name="taskTitle" placeholder="Task title *" required>

                <input type="text" id="taskDescription" name="taskDescription" placeholder="Description (optional)">

                <label for="taskDueDate">Due date</label>
                <input type="date" id="taskDueDate" name="taskDueDate" required>
                
                <label for="taskPriority">Priority</label>
                <select name="taskPriority" id="taskPriority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="high">Urgent</option>
                </select>

                <label for="taskProject">Project</label>
                <select name="taskProject" id="taskProject">
                    <option value="Standard">Standard</option>
                </select>

                <input type="text" id="taskNotes" name="taskNotes" placeholder="Notes (optional)">


                <div>
                    <button value="cancel">Cancel</button>
                    <button id="createTaskBtn" value="create">Create task</button>
                </div>
            </form>
        </dialog>

    </main>

</body>
</html>
